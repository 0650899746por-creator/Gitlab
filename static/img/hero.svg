<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="ภาพประกอบลายวงจรอิเล็กทรอนิกส์และสัญลักษณ์ทรานซิสเตอร์ BJT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2338"/>
      <stop offset="0.55" stop-color="#0d2e4c"/>
      <stop offset="1" stop-color="#123f60"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#27c4b2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#27c4b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f7fb0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2f7fb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#8fc4dd" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd0c0" stop-opacity="0.05"/>
      <stop offset="0.55" stop-color="#2fd0c0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7ee7d9" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <circle cx="1180" cy="300" r="330" fill="url(#glowA)" filter="url(#soft)"/>
  <circle cx="1460" cy="120" r="240" fill="url(#glowB)" filter="url(#soft)"/>
  <circle cx="820" cy="520" r="220" fill="url(#glowB)" opacity="0.5" filter="url(#soft)"/>
