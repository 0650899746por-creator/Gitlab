{% macro circuit(mode) -%}
<svg class="circuit" viewBox="0 0 200 180" aria-hidden="true" focusable="false">
  <g class="wire">
    <path d="M22 20 H150"/>
    <path d="M112 20 V30 M112 54 V76"/>
    <rect class="res" x="106" y="30" width="12" height="24" rx="1.5"/>
    <path d="M112 76 L88 90"/>
    <circle class="body" cx="96" cy="95" r="22"/>
    <path class="bar" d="M88 84 V106"/>
    <path d="M70 95 H88 M52 20 V32 M52 54 V95"/>
    <rect class="res" x="46" y="32" width="12" height="22" rx="1.5"/>
    <path d="M52 95 H70"/>
    <path d="M88 102 L112 114"/>
    <polygon class="arrow" points="112,114 101.5,112.3 104.9,106.1"/>
    {% if mode == "divider" %}
    <path d="M52 95 V112 M52 134 V150"/>
    <rect class="res" x="46" y="112" width="12" height="22" rx="1.5"/>
    <circle class="dot" cx="52" cy="95" r="2.6"/>
    {% endif %}
    {% if mode == "fixed" %}
    <path d="M112 114 V150"/>
    {% else %}
    <path d="M112 114 V124 M112 146 V150"/>
    <rect class="res" x="106" y="124" width="12" height="22" rx="1.5"/>
    {% endif %}
    <g class="gnd">
      <path d="M100 150 H124 M104 155 H120 M108 160 H116"/>
      {% if mode == "divider" %}<path d="M40 150 H64 M44 155 H60 M48 160 H56"/>{% endif %}
    </g>
    <circle class="dot" cx="52" cy="20" r="2.6"/>
    <circle class="dot" cx="112" cy="20" r="2.6"/>
  </g>
</svg>
{%- endmacro %}
